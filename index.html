<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة بيكسل | Pixel Group</title>
    <!-- مكتبة HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- خطوط مستقبلية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050510;
            --panel-bg: rgba(10, 15, 30, 0.7);
            --neon-cyan: #00f3ff;
            --neon-blue: #0055ff;
            --neon-red: #ff003c;
            --neon-green: #00ff66;
            --text-main: #e0fbfc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 85, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.15), transparent 25%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .cyber-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) scale(2);
            animation: gridMove 10s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) scale(2); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(30px) scale(2); }
        }

        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .brand {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
        }

        .brand h1 {
            font-family: 'Orbitron', 'Cairo', sans-serif;
            margin: 0;
            font-size: 1.6rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-blue);
            letter-spacing: 2px;
        }

        .brand .subtitle {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #a0c4c7;
            line-height: 1.5;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.3);
        }
        
        .brand .subtitle span {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        /* تنسيق حقول الإدخال والاختيار */
        .cyber-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .cyber-input:focus {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .cyber-input option {
            background-color: #050510;
            color: var(--neon-cyan);
        }

        .clean-btn {
            background: rgba(255, 0, 60, 0.15);
            border: 1px solid var(--neon-red);
            color: #ff88a5;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            transition: all 0.3s;
            text-align: center;
        }

        .clean-btn:hover {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .groups-container {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        details {
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        details[open] {
            border-color: rgba(0, 243, 255, 0.5);
        }

        summary {
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-main);
            background: linear-gradient(90deg, rgba(0,85,255,0.2) 0%, transparent 100%);
            user-select: none;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        summary:hover {
            background: linear-gradient(90deg, rgba(0,243,255,0.3) 0%, transparent 100%);
        }

        .channel-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            color: #a0c4c7;
            border: none;
            border-top: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .channel-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            padding-right: 18px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            box-shadow: 0 0 4px #555;
            transition: all 0.3s;
        }

        .status-online {
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse-green 2s infinite;
        }

        .status-offline {
            background-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 4px var(--neon-green); }
            50% { box-shadow: 0 0 12px var(--neon-green); }
            100% { box-shadow: 0 0 4px var(--neon-green); }
        }

        .player-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
        }

        .controls-bar {
            width: 90%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(10, 15, 30, 0.8);
            padding: 8px 15px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
        }

        .quality-selector {
            background: #000;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 5px 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .video-wrapper {
            width: 90%;
            max-width: 1000px;
            position: relative;
            padding: 4px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-cyan));
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        video {
            width: 100%;
            display: block;
            border-radius: 8px;
            background-color: #000;
        }

        .now-playing {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            font-family: 'Orbitron', 'Cairo', sans-serif;
            letter-spacing: 1px;
            text-align: center;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="sidebar">
        <!-- قسم العنوان الجديد -->
        <div class="brand">
            <h1>مجموعة بيكسل</h1>
            <div class="subtitle">
                بإدارة: <span>مصطفى رشيد</span><br>
                فرع أول: أطمة | فرع ثاني: الدانا
            </div>
        </div>

        <!-- قائمة اختيار السيرفر / القائمة -->
        <select id="playlist-selector" class="cyber-input" onchange="loadSelectedPlaylist()">
            <option value="https://iptv-org.github.io/iptv/index.category.m3u">القائمة العالمية (حسب التصنيف)</option>
            <option value="https://iptv-org.github.io/iptv/index.m3u">القائمة الشاملة (جميع القنوات)</option>
            <option value="https://iptv-org.github.io/iptv/languages/ara.m3u" selected>القنوات العربية</option>
        </select>

        <input type="text" id="search-box" class="cyber-input" placeholder="ابحث في قاعدة البيانات..." oninput="filterChannels()">
        
        <button class="clean-btn" onclick="removeOfflineChannels()">[x] مسح القنوات غير العاملة</button>

        <div class="groups-container" id="groups-list">
            <div style="color: var(--neon-cyan); text-align: center; margin-top: 50px;">
                <p>جاري تهيئة النظام...</p>
            </div>
        </div>
    </div>

    <div class="player-container">
        <div class="controls-bar">
            <span style="font-size: 0.9rem; color: var(--neon-cyan);">إعدادات البث</span>
            <div>
                <label style="font-size: 0.85rem; margin-left: 8px;">دقة الفيديو:</label>
                <select id="quality-select" class="quality-selector" onchange="changeQuality(this.value)">
                    <option value="-1">تلقائي (Auto)</option>
                </select>
            </div>
        </div>

        <div class="video-wrapper">
            <video id="video" controls autoplay></video>
        </div>
        <div class="now-playing" id="now-playing-text">النظام في وضع الاستعداد</div>
    </div>

    <script>
        let allChannelsData = {};
        let hls;

        // تحميل القائمة المختارة عند فتح الصفحة
        window.onload = () => {
            loadSelectedPlaylist();
        };

        // دالة جلب القائمة بناءً على اختيار المستخدم
        function loadSelectedPlaylist() {
            const url = document.getElementById('playlist-selector').value;
            const groupsList = document.getElementById('groups-list');
            
            groupsList.innerHTML = '<div style="color: var(--neon-cyan); text-align: center; margin-top: 50px;"><p>جاري استيراد البيانات... قد يستغرق هذا بضع ثوانٍ للقوائم الكبيرة.</p></div>';
            document.getElementById('now-playing-text').innerText = "جاري تحديث القنوات...";

            fetch(url)
                .then(res => res.text())
                .then(data => {
                    const groups = parseM3U(data);
                    renderGroups(groups);
                    document.getElementById('now-playing-text').innerText = "تم تحديث القنوات بنجاح. اختر قناة.";
                })
                .catch(err => {
                    console.error(err);
                    groupsList.innerHTML = '<div style="color: var(--neon-red); text-align: center; margin-top: 50px;"><p>فشل الاتصال بالخادم.</p></div>';
                    document.getElementById('now-playing-text').innerText = "حدث خطأ أثناء جلب القنوات.";
                });
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const groups = {};
            let currentGroup = 'غير مصنف';
            let currentName = '';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    currentGroup = groupMatch ? groupMatch[1] : 'قنوات عامة';

                    const commaIndex = line.lastIndexOf(',');
                    currentName = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'قناة غير معنونة';
                } 
                else if (line && !line.startsWith('#')) {
                    const streamUrl = line;
                    if (!groups[currentGroup]) groups[currentGroup] = [];
                    if (currentName) {
                        groups[currentGroup].push({ name: currentName, url: streamUrl });
                    }
                    currentName = '';
                }
            }
            return groups;
        }

        function renderGroups(groups) {
            allChannelsData = groups;
            const container = document.getElementById('groups-list');
            container.innerHTML = '';

            Object.keys(groups).sort().forEach((group) => {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                summary.innerHTML = `<span>${group}</span> <span style="color:#888; font-size:0.8rem;" class="count-badge">[${groups[group].length}]</span>`;
                
                details.addEventListener('toggle', function() {
                    if (this.open && !this.dataset.checked) {
                        this.dataset.checked = "true";
                        const buttons = this.querySelectorAll('.channel-btn');
                        buttons.forEach(btn => {
                            checkChannelStatus(btn.dataset.url, btn.querySelector('.status-indicator'));
                        });
                    }
                });

                details.appendChild(summary);

                groups[group].forEach(channel => {
                    const btn = document.createElement('button');
                    btn.className = 'channel-btn';
                    btn.dataset.url = channel.url;
                    
                    btn.innerHTML = `
                        <span style="text-align: right; width: 85%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${channel.name}</span>
                        <div class="status-indicator"></div>
                    `;
                    
                    btn.onclick = () => playChannel(channel.url, channel.name);
                    details.appendChild(btn);
                });

                container.appendChild(details);
            });
        }

        async function checkChannelStatus(url, indicatorElement) {
            try {
                const response = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
                if (response.ok) {
                    indicatorElement.className = 'status-indicator status-online';
                } else {
                    indicatorElement.className = 'status-indicator status-offline';
                }
            } catch (error) {
                indicatorElement.className = 'status-indicator status-offline';
            }
        }

        function removeOfflineChannels() {
            const detailsList = document.querySelectorAll('#groups-list details');
            let removedCount = 0;

            detailsList.forEach(details => {
                const buttons = details.querySelectorAll('.channel-btn');
                let activeCount = 0;

                buttons.forEach(btn => {
                    const indicator = btn.querySelector('.status-indicator');
                    if (indicator.classList.contains('status-offline')) {
                        btn.remove();
                        removedCount++;
                    } else {
                        activeCount++;
                    }
                });

                const badge = details.querySelector('.count-badge');
                if (badge) badge.innerText = `[${activeCount}]`;

                if (activeCount === 0) {
                    details.remove();
                }
            });

            document.getElementById('now-playing-text').innerText = `تم تنظيف القائمة وإزالة ${removedCount} قناة غير عاملة.`;
        }

        function filterChannels() {
            const filter = document.getElementById('search-box').value.toLowerCase();
            const detailsList = document.querySelectorAll('#groups-list details');

            detailsList.forEach(details => {
                const buttons = details.querySelectorAll('.channel-btn');
                let hasVisibleBtn = false;

                buttons.forEach(btn => {
                    const text = btn.innerText.toLowerCase();
                    if (text.includes(filter)) {
                        btn.style.display = 'flex';
                        hasVisibleBtn = true;
                    } else {
                        btn.style.display = 'none';
                    }
                });

                if (filter && hasVisibleBtn) {
                    details.open = true;
                    details.style.display = 'block';
                } else if (filter && !hasVisibleBtn) {
                    details.style.display = 'none';
                } else {
                    details.open = false;
                    details.style.display = 'block';
                }
            });
        }

        const video = document.getElementById('video');
        const nowPlayingText = document.getElementById('now-playing-text');
        const qualitySelect = document.getElementById('quality-select');

        function playChannel(streamUrl, channelName) {
            nowPlayingText.innerText = "جاري عرض: " + channelName;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                    qualitySelect.innerHTML = '<option value="-1">تلقائي (Auto)</option>';
                    data.levels.forEach((level, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.innerText = level.height ? level.height + 'p' : `مستوى ${index + 1}`;
                        qualitySelect.appendChild(option);
                    });
                    video.play().catch(e => console.log("Play error:", e));
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        nowPlayingText.innerText = "خطأ: فشل الاتصال بهذه القناة";
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play();
            }
        }

        function changeQuality(levelIndex) {
            if (hls) {
                hls.currentLevel = parseInt(levelIndex);
            }
        }
    </script>
</body>
</html>
